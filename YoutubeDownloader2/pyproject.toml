[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytdl-core"
version = "2.0.0"
description = "Batch audio downloader with composite scoring, AcoustID fingerprint verification, and MusicBrainz enrichment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Juan Cardona", email = "juanblandon975@gmail.com" }
]
keywords = ["youtube", "download", "music", "audio", "yt-dlp", "acoustid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet",
]

dependencies = [
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47",
    "requests>=2.31",
    "musicbrainzngs>=0.7",
    "rapidfuzz>=3.6",
    "pyacoustid>=1.3",
    "pydub>=0.25",
    # Not optional. search.py imports this in a try/except, so a clean install
    # without it does not fail -- it silently loses both the YouTube Music
    # catalogue source and search_ytmusic_album, which is the exact-match
    # label lookup worth CATALOG_SOURCE_BONUS. The tests mock the module, so
    # nothing else noticed.
    "ytmusicapi>=1.8",
]

[project.optional-dependencies]
cli = [
    "rich>=13.7",
]
dev = [
    "rich>=13.7",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    # Needed for type checking to see the libraries this project calls, and
    # incidentally for running the suite at all.
    "pytest-asyncio>=0.23",
]

[project.scripts]
ytdl = "ytdl_core.cli_entry:main"

[project.urls]
Repository = "https://github.com/Juanes72/YoutubeDownloader"
Issues     = "https://github.com/Juanes72/YoutubeDownloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["ytdl_core"]

[tool.hatch.build.targets.wheel.force-include]
"tools/jev.mts" = "ytdl_core/tools/jev.mts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
# Was `no_site_packages = true`, which made every third-party import resolve to
# Any -- yt_dlp, rich and mutagen included -- so the check could not report a
# single thing about the code that actually calls them.
ignore_missing_imports = true
